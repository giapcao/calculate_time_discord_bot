name: Build and Push

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Optional image tag to publish/deploy (example: v1.0.0)"
        required: false
        type: string

permissions:
  contents: write
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare image name
        id: prep
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY}"
          IMAGE=$(echo "$IMAGE" | tr '[:upper:]' '[:lower:]')
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

      - name: Resolve image tag
        id: tag
        env:
          INPUT_TAG: ${{ github.event.inputs.image_tag }}
          DEFAULT_TAG: ${{ vars.IMAGE_TAG }}
        run: |
          TAG="$INPUT_TAG"

          if [ -z "$TAG" ]; then
            TAG="$DEFAULT_TAG"
          fi

          if [ -z "$TAG" ]; then
            TAG="latest"
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.prep.outputs.image }}:${{ steps.tag.outputs.tag }}

      - name: Trigger deploy workflow
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_TAG: ${{ steps.tag.outputs.tag }}
        run: |
          curl -sS -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            https://api.github.com/repos/${GITHUB_REPOSITORY}/dispatches \
            -d "{\"event_type\":\"deploy\",\"client_payload\":{\"image_tag\":\"${IMAGE_TAG}\"}}"
